name: Docker Build Pipeline

on:
  push:
    branches:
      - 'main'
    paths:
      - 'Dockerfile'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'Dockerfile'

jobs:
  trigger-workflow:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Trigger Workflow in Another Repo
      uses: peter-evans/repository-dispatch@v1
      with:
        token: ${{ secrets.TOKEN_GIT }}
        repository: 'kiriti07/test-workflow'
        event-type: 'trigger-docker-build'
        client-payload: '{"ref": "main", "sha": "${{ github.sha }}"}'
